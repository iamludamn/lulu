name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    if: ${{ github.repository == 'iamludamn/lulu' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/desktop/go.mod
          cache-dependency-path: client/desktop/go.sum
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:bundle
      - run: npm exec -- wrangler deploy
        working-directory: apps/cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'de4897a194002b8815e728d7240c4218' }}
