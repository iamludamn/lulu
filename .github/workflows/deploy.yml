name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    if: ${{ github.repository == 'iamludamn/lulu' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/desktop/go.mod
          cache-dependency-path: client/desktop/go.sum
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - shell: bash
        run: |
          d1_databases=$(npm exec -- wrangler d1 list --json)
          if ! jq -e 'any(.[]; .name == "lulu-artifacts")' <<< "$d1_databases" > /dev/null; then
            npm exec -- wrangler d1 create lulu-artifacts --update-config=false
          fi
          npm exec -- wrangler d1 migrations apply LULU_METADATA --remote
          if [[ -z "$LULU_OBSERVABILITY_TOKEN" ]]; then
            npm exec -- wrangler deploy
            exit
          fi
          umask 077
          lulu_secrets_file=$(mktemp "${RUNNER_TEMP}/lulu-secrets.XXXXXX")
          trap 'rm -f "$lulu_secrets_file"' EXIT
          node -e 'console.log(JSON.stringify({ LULU_OBSERVABILITY_TOKEN: process.env.LULU_OBSERVABILITY_TOKEN }))' > "$lulu_secrets_file"
          npm exec -- wrangler deploy --secrets-file "$lulu_secrets_file"
        working-directory: apps/cf
        env:
          LULU_OBSERVABILITY_TOKEN: ${{ secrets.LULU_OBSERVABILITY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'de4897a194002b8815e728d7240c4218' }}
