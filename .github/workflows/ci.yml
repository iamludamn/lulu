name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/desktop/go.mod
          cache-dependency-path: client/desktop/go.sum
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Check live sandbox
        if: github.event_name == 'push'
        run: LULU_SANDBOX_LIVE=1 node --test core/tests/sandbox-agent.test.mjs
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      - run: npm run build
      - run: npm run build:cross --prefix client/desktop
