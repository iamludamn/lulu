name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Check live sandbox
        if: github.event_name == 'push' && github.repository == 'iamludamn/lulu'
        run: LULU_SANDBOX_LIVE=1 node --test core/tests/sandbox-agent.test.mjs
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      - run: npm run build
      - name: Bundle Worker and Web configuration assets
        run: npm exec -w @lulu/cf -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/lulu-worker"

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint-swift.sh
      - run: swift test --package-path client/ios/LuluKit
      - run: scripts/test-ios-experience.sh
      - name: Build Lulu for iOS
        run: >-
          xcodebuild -project client/ios/Lulu.xcodeproj -scheme Lulu
          -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/lulu-ios"
          CODE_SIGNING_ALLOWED=NO build
