name: ci

on:
  pull_request:
  push:
    branches: [main, 't3/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check live sandbox
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'iamludamn/lulu'
        run: LULU_SANDBOX_LIVE=1 node --test core/tests/sandbox-agent.test.mjs
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      - run: npm run build
      - name: Bundle Worker and Web configuration assets
        run: npm exec -w @lulu/cf -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/lulu-worker"

  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: scripts/lint-swift.sh
      - run: swift test --package-path client/ios/LuluKit
      - run: scripts/test-ios-experience.sh
      - name: Build Lulu for iOS
        run: >-
          xcodebuild -project client/ios/Lulu.xcodeproj -scheme Lulu
          -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/lulu-ios"
          CODE_SIGNING_ALLOWED=NO build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec -- e2e-web install chromium --with-deps
      - run: npm run test:e2e -- --trace retain-on-failure
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: web-e2e-results
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/results/
            .e2e/logs/

  ios-e2e:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Lulu for iOS Simulator
        run: >-
          xcodebuild -project client/ios/Lulu.xcodeproj -scheme Lulu
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/lulu-ios-e2e" CODE_SIGNING_ALLOWED=NO build
      - name: Boot an iPhone 17 Pro and install Lulu
        run: |
          set -euo pipefail
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-26-5
          udid=$(xcrun simctl list devices available -j | jq -er --arg runtime "$runtime" '
            first(.devices[$runtime][]? | select(.name == "iPhone 17 Pro") | .udid)
          ')
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/lulu-ios-e2e/Build/Products/Debug-iphonesimulator/Lulu.app"
          echo "E2E_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - run: npm run test:e2e:ios -- --trace retain-on-failure
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ios-e2e-results
          include-hidden-files: true
          path: |
            .e2e/ios/report.json
            .e2e/ios/junit.xml
            .e2e/ios/results/
            .e2e/ios/logs/

  check:
    name: Check
    if: always()
    needs: [static, verify, ios, web-e2e, ios-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
