<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counter</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 24px; display: grid; gap: 14px; justify-items: start; }
  button { font: inherit; padding: 6px 14px; }
  pre { margin: 0; padding: 10px 12px; background: #8881; border-radius: 6px; }
</style>
<h2>HTML artifact</h2>
<div>Count: <b id="n">…</b></div>
<button id="inc">Increment</button>
<pre id="log">loading</pre>
<script>
  var log = document.getElementById("log"), n = document.getElementById("n");
  function show(s) { log.textContent = s; }
  var typed = typeof window.lulu;
  window.lulu.state.get().then(function (s) {
    var count = s && typeof s.count === "number" ? s.count : 0;
    n.textContent = count;
    show("typeof window.lulu = " + typed + "\nget() -> " + JSON.stringify(s));
    document.getElementById("inc").onclick = function () {
      count++;
      n.textContent = count;
      window.lulu.state.set({ count: count, at: new Date().toISOString() }).then(function () {
        return window.lulu.state.get();
      }).then(function (back) {
        show("set() ok\nget() -> " + JSON.stringify(back));
      }, function (e) { show("set() failed: " + e); });
    };
  }, function (e) { show("get() failed: " + e); });
</script>
