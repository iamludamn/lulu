extensions:
  bearertokenauth:
    scheme: Bearer
    token: ${env:OTLP_TOKEN}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  transform/memory_metric_scope:
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "lulu.bot.id") where IsMatch(name, "^memory[.]") or attributes["lulu.agent"] == "memory"
  batch:

connectors:
  forward/metrics:
  span_metrics:
    namespace: lulu.span
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    histogram:
      unit: ms
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s, 30s, 60s, 120s, 300s, 600s]
    dimensions:
      - name: lulu.bot.id
      - name: lulu.conversation.kind
      - name: lulu.agent
      - name: gen_ai.request.model
      - name: gen_ai.tool.name
      - name: lulu.memory.failure_category
      - name: lulu.memory.outcome
      - name: lulu.recall.configured
      - name: lulu.recall.inject
      - name: lulu.recall.fallback
      - name: lulu.memory.coverage
      - name: lulu.memory.available
      - name: lulu.command
    metrics_flush_interval: 15s
    exemplars:
      enabled: true

  signal_to_metrics:
    spans:
      - name: lulu.memory.request_attempts
        description: Model request attempts by actual replayed memory section coverage
        attributes:
          - key: lulu.memory.coverage
        conditions:
          - span.name == "memory.request"
        sum:
          monotonic: true
          value: "1"
      - name: lulu.memory.episodes
        attributes:
          - key: lulu.memory.outcome
            optional: true
        conditions:
          - IsMatch(span.name, "^memory[.](alarm|update)$")
          - span.attributes["lulu.memory.episodes"] != nil
        histogram:
          value: span.attributes["lulu.memory.episodes"]
          buckets: [0, 1, 10, 100, 1000, 10000, 60000, 600000, 3600000, 86400000]
      - name: lulu.memory.blocked
        attributes:
          - key: lulu.memory.outcome
            optional: true
        conditions:
          - span.attributes["lulu.memory.blocked"] != nil
        histogram:
          value: span.attributes["lulu.memory.blocked"]
          buckets: [0, 1, 10, 100, 1000, 10000, 60000, 600000, 3600000, 86400000]
      - name: lulu.memory.clipped_files
        attributes:
          - key: lulu.memory.outcome
            optional: true
        conditions:
          - span.attributes["lulu.memory.clipped_files"] != nil
        histogram:
          value: span.attributes["lulu.memory.clipped_files"]
          buckets: [0, 1, 10, 100, 1000, 10000, 60000, 600000, 3600000, 86400000]
      - name: lulu.memory.characters
        attributes:
          - key: lulu.memory.outcome
            optional: true
        conditions:
          - span.attributes["lulu.memory.characters"] != nil
        histogram:
          value: span.attributes["lulu.memory.characters"]
          buckets: [0, 1, 10, 100, 1000, 10000, 60000, 600000, 3600000, 86400000]
      - name: lulu.memory.pending_age_ms
        attributes:
          - key: lulu.memory.outcome
            optional: true
        conditions:
          - span.attributes["lulu.memory.pending_age_ms"] != nil
        histogram:
          value: span.attributes["lulu.memory.pending_age_ms"]
          buckets: [0, 1, 10, 100, 1000, 10000, 60000, 600000, 3600000, 86400000]
      - name: lulu.memory.overdue_ms
        attributes:
          - key: lulu.memory.outcome
            optional: true
        conditions:
          - span.attributes["lulu.memory.overdue_ms"] != nil
        histogram:
          value: span.attributes["lulu.memory.overdue_ms"]
          buckets: [0, 1, 10, 100, 1000, 10000, 60000, 600000, 3600000, 86400000]
      - name: lulu.memory.retries
        attributes:
          - key: lulu.memory.outcome
            optional: true
        conditions:
          - span.attributes["lulu.memory.retries"] != nil
        histogram:
          value: span.attributes["lulu.memory.retries"]
          buckets: [0, 1, 10, 100, 1000, 10000, 60000, 600000, 3600000, 86400000]
      - name: lulu.chat.input_tokens
        description: Input tokens summed from chat spans
        attributes: &chat_dims
          - key: gen_ai.provider.name
            optional: true
          - key: gen_ai.request.model
            optional: true
          - key: lulu.agent
            optional: true
          - key: lulu.bot.id
            optional: true
          - key: lulu.conversation.kind
            optional: true
        conditions:
          - span.attributes["gen_ai.usage.input_tokens"] != nil
        sum:
          monotonic: true
          value: span.attributes["gen_ai.usage.input_tokens"]
      - name: lulu.chat.output_tokens
        description: Output tokens summed from chat spans
        attributes: *chat_dims
        conditions:
          - span.attributes["gen_ai.usage.output_tokens"] != nil
        sum:
          monotonic: true
          value: span.attributes["gen_ai.usage.output_tokens"]
      - name: lulu.chat.cache_read_tokens
        description: Cache read tokens summed from chat spans
        attributes: *chat_dims
        conditions:
          - span.attributes["gen_ai.usage.cache_read.input_tokens"] != nil
        sum:
          monotonic: true
          value: span.attributes["gen_ai.usage.cache_read.input_tokens"]
      - name: lulu.chat.cost
        description: Cost summed from chat spans
        attributes: *chat_dims
        conditions:
          - span.attributes["lulu.usage.cost"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.usage.cost"]
      - name: lulu.chat.cache_write_tokens
        attributes: *chat_dims
        conditions:
          - span.attributes["gen_ai.usage.cache_creation.input_tokens"] != nil
        sum:
          monotonic: true
          value: span.attributes["gen_ai.usage.cache_creation.input_tokens"]
      - name: lulu.chat.cost_input
        attributes: *chat_dims
        conditions:
          - span.attributes["lulu.usage.cost.input"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.usage.cost.input"]
      - name: lulu.chat.cost_output
        attributes: *chat_dims
        conditions:
          - span.attributes["lulu.usage.cost.output"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.usage.cost.output"]
      - name: lulu.chat.cost_cache_read
        attributes: *chat_dims
        conditions:
          - span.attributes["lulu.usage.cost.cache_read"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.usage.cost.cache_read"]
      - name: lulu.chat.cost_cache_write
        attributes: *chat_dims
        conditions:
          - span.attributes["lulu.usage.cost.cache_write"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.usage.cost.cache_write"]
      - name: lulu.run.turns
        description: Turns summed from run spans
        attributes: &dims
          - key: lulu.bot.id
            optional: true
          - key: lulu.conversation.kind
            optional: true
        conditions:
          - span.attributes["lulu.run.turns"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.turns"]
      - name: lulu.run.chats
        description: Chats summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.chats"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.chats"]
      - name: lulu.run.tools
        description: Tool calls summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.tools"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.tools"]
      - name: lulu.run.tool_errors
        description: Tool errors summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.tool_errors"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.tool_errors"]
      - name: lulu.run.delegates
        description: Delegates summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.delegates"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.delegates"]
      - name: lulu.run.retries
        description: Retries summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.retries"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.retries"]
      - name: lulu.run.compactions
        description: Compactions summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.compactions"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.compactions"]
      - name: lulu.run.input_tokens
        description: Input tokens summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.input_tokens"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.input_tokens"]
      - name: lulu.run.output_tokens
        description: Output tokens summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.output_tokens"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.output_tokens"]
      - name: lulu.run.cache_read_tokens
        description: Cache read tokens summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.cache_read_tokens"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.cache_read_tokens"]
      - name: lulu.run.cost
        description: Cost summed from run spans
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.cost"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.cost"]
      - name: lulu.run.cache_write_tokens
        attributes: *dims
        conditions:
          - span.attributes["lulu.run.cache_write_tokens"] != nil
        sum:
          monotonic: true
          value: span.attributes["lulu.run.cache_write_tokens"]

exporters:
  otlp_http/lgtm:
    endpoint: http://lgtm:4318
    tls:
      insecure: true

service:
  extensions: [bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/lgtm, forward/metrics]
    traces/metrics:
      receivers: [forward/metrics]
      processors: [transform/memory_metric_scope, batch]
      exporters: [span_metrics, signal_to_metrics]
    metrics:
      receivers: [span_metrics, signal_to_metrics]
      processors: [batch]
      exporters: [otlp_http/lgtm]
